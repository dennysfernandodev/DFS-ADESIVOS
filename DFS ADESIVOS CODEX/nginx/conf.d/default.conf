server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php index.html index.htm;

    client_max_body_size 32m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Gzip configuration
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Brotli configuration (habilite se o módulo estiver disponível no build atual)
    #brotli on;
    #brotli_comp_level 5;
    #brotli_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location = /favicon.ico { log_not_found off; access_log off; }
    location = /apple-touch-icon.png { log_not_found off; access_log off; }
    location = /robots.txt { allow all; log_not_found off; access_log off; }

    location ~* \.(jpg|jpeg|gif|png|svg|webp|ico|css|js|woff|woff2|ttf|otf|eot|mp4|webm)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, no-transform";
        try_files $uri $uri/ @fallback;
    }

    location @fallback {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.(?:php|phar)$ {
        try_files $uri =404;
        include fastcgi_params;
        include fastcgi.conf;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_index index.php;
        fastcgi_pass wordpress:9000;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;

        set $no_cache 0;
        if ($request_method = POST) { set $no_cache 1; }
        if ($query_string != "") { set $no_cache 1; }
        if ($request_uri ~* "/wp-admin/|/xmlrpc.php|/wp-login.php|/cart/|/checkout/|/my-account/") { set $no_cache 1; }
        if ($http_cookie ~* "comment_author_|wordpress_[a-f0-9]+|wp-postpass_|wordpress_logged_in") { set $no_cache 1; }

        add_header X-Cache-Bypass $no_cache;
    }

    location ~* ^/(wp-content/uploads|uploads|files)/.*\.(?:php|phar)$ {
        deny all;
    }

    location ~* ^/wp-includes/.*\.(?:php|phar)$ {
        deny all;
    }

    location ~* \.(?:manifest|appcache|html?|xml|json)$ {
        expires -1;
    }

    location ~* \.(?:txt|log)$ {
        allow 127.0.0.1;
        deny all;
    }

    location ~* /\.(?!well-known).* {
        deny all;
    }
}
