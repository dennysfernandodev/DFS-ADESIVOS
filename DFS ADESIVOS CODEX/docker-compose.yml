version: "3.9"

services:
  wordpress:
    image: wordpress:6.5.2-php8.2-fpm
    container_name: dfs-wordpress
    env_file:
      - .env
    environment:
      WORDPRESS_DB_HOST: ${DB_HOST}
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASS}
      TZ: ${TZ}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_REDIS_HOST', 'redis');
        define('WP_REDIS_PASSWORD', '${REDIS_PASS}');
        define('WP_REDIS_PORT', 6379);
        define('FORCE_SSL_ADMIN', true);
        define('DISALLOW_FILE_EDIT', true);
        define('WP_MEMORY_LIMIT', '256M');
        define('WP_ENVIRONMENT_TYPE', 'production');
    volumes:
      - ./wp-content:/var/www/html/wp-content
      - ./php/php.ini:/usr/local/etc/php/conf.d/zz-dfs.ini:ro
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    container_name: dfs-nginx
    depends_on:
      wordpress:
        condition: service_started
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./wp-content:/var/www/html/wp-content
    networks:
      - frontend
      - internal
    environment:
      - TZ=${TZ}
    ports:
      - "80:80"
    restart: unless-stopped

  db:
    image: mariadb:10.11
    container_name: dfs-db
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-${DB_PASS}}
      TZ: ${TZ}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: dfs-redis
    command: redis-server --requirepass ${REDIS_PASS} --maxmemory 256mb --maxmemory-policy allkeys-lru
    environment:
      - TZ=${TZ}
    volumes:
      - redis_data:/data
    networks:
      - internal
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: dfs-mailhog
    networks:
      - internal
    ports:
      - "8025:8025"
    environment:
      - TZ=${TZ}
    restart: unless-stopped

  wp-cli:
    image: wordpress:cli-php8.2
    container_name: dfs-wp-cli
    env_file:
      - .env
    environment:
      WORDPRESS_DB_HOST: ${DB_HOST}
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASS}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_REDIS_HOST', 'redis');
        define('WP_REDIS_PASSWORD', '${REDIS_PASS}');
        define('WP_REDIS_PORT', 6379);
    entrypoint: ["wp", "--allow-root"]
    working_dir: /var/www/html
    volumes:
      - ./wp-content:/var/www/html/wp-content
    networks:
      - internal
    depends_on:
      wordpress:
        condition: service_started

networks:
  frontend:
    driver: bridge
  internal:
    internal: true

volumes:
  db_data:
  redis_data:
